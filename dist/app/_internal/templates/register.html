{% extends "base.html" %}

{% block title %}Cadastro - Gerador de Ideias{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Criar Conta</h1>
            <p>Cadastre-se para começar a gerar ideias de conteúdo</p>
        </div>
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" id="name" name="name" required placeholder="Seu nome" autocomplete="name">
            </div>
            
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com" autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirmar Senha</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repita a senha" autocomplete="new-password" minlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary btn-full">Criar Conta</button>
        </form>
        
        <div class="auth-footer">
            <p>Já tem conta? <a href="{{ url_for('login') }}">Faça login</a></p>
        </div>
    </div>
</div>
{% endblock %}
