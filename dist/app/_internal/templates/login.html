{% extends "base.html" %}

{% block title %}Login - Gerador de Ideias{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>💡 Gerador de Ideias</h1>
            <p>Entre na sua conta para gerar ideias incríveis de conteúdo</p>
        </div>
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com" autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required placeholder="Sua senha" autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-full">Entrar</button>
        </form>
        
        <div class="auth-footer">
            <p>Não tem conta? <a href="{{ url_for('register') }}">Cadastre-se</a></p>
        </div>
    </div>
</div>
{% endblock %}
